# CloudFormation: IaC nativo de AWS. El "state" lo maneja AWS (el Stack).
# Deploy: aws cloudformation deploy --template-file s3-bucket.yaml --stack-name lab-bucket --parameter-overrides BucketName=mi-bucket-unico
AWSTemplateFormatVersion: "2010-09-09"
Description: Bucket S3 seguro (cifrado, versionado, sin acceso público)

Parameters:
  BucketName:
    Type: String

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  BucketArn:
    Value: !GetAtt Bucket.Arn
